<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f5f5"/><rect x="0" y="0" width="245" height="650" fill="#e9eaec"/><text x="22" y="42" font-family="Arial" font-size="18" font-weight="bold">Repository</text><g font-family="Arial" font-size="15" fill="#333"><text x="28" y="92">.cursor/rules/</text><text x="28" y="127">docs/</text><text x="28" y="162">src/</text><text x="28" y="197">tests/</text><text x="28" y="232">.github/workflows/</text></g><text x="290" y="48" font-family="Arial" font-size="23" font-weight="bold">Developer onboarding workflow</text><rect x="290" y="85" width="850" height="110" rx="10" fill="#fff" stroke="#ccc"/><text x="320" y="120" font-family="Arial" font-size="15" fill="#666">Plan, build, test, and review with repository context</text><text x="320" y="158" font-family="Arial" font-size="17">Add rotate_image() following existing validation and test conventions.</text><g font-family="Arial" font-size="16" text-anchor="middle"><rect x="300" y="250" width="155" height="90" rx="10" fill="#fff" stroke="#bbb"/><text x="377" y="287" font-weight="bold">1. Clarify</text><text x="377" y="315">acceptance criteria</text><rect x="485" y="250" width="155" height="90" rx="10" fill="#fff" stroke="#bbb"/><text x="562" y="287" font-weight="bold">2. Plan</text><text x="562" y="315">smallest change</text><rect x="670" y="250" width="155" height="90" rx="10" fill="#fff" stroke="#bbb"/><text x="747" y="287" font-weight="bold">3. Build</text><text x="747" y="315">code + tests</text><rect x="855" y="250" width="155" height="90" rx="10" fill="#fff" stroke="#bbb"/><text x="932" y="287" font-weight="bold">4. Validate</text><text x="932" y="315">CI + review</text></g><text x="300" y="405" font-family="Arial" font-size="18" font-weight="bold">Deterministic quality gates</text><rect x="300" y="430" width="710" height="120" rx="10" fill="#fff" stroke="#bbb"/><g font-family="monospace" font-size="16" fill="#333"><text x="330" y="465">ruff check src tests</text><text x="330" y="495">ruff format --check src tests</text><text x="330" y="525">pytest --cov=src --cov-fail-under=90</text></g><text x="300" y="600" font-family="Arial" font-size="14" fill="#666">The AI assistant accelerates contribution; repository rules, tests, CI, and human review remain the controls.</text></svg>